name: Fislik
options:
  bundleIdPrefix: dev.selamet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: tr
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Fislik:
    type: application
    platform: iOS
    sources:
      - path: Fislik
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.selamet.fislik
        PRODUCT_NAME: Fislik
        INFOPLIST_FILE: Fislik/Info.plist
        CODE_SIGN_ENTITLEMENTS: Fislik/Fislik.entitlements
        GOOGLE_CLIENT_ID: ""
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: FislikWidgets
  FislikWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FislikWidgets
      - path: Fislik/Shared
      - path: Fislik/DesignSystem/Icons.swift
      - path: Fislik/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.selamet.fislik.widgets
        PRODUCT_NAME: FislikWidgets
        INFOPLIST_FILE: FislikWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: FislikWidgets/FislikWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        SKIP_INSTALL: YES
  FislikTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FislikTests
    dependencies:
      - target: Fislik
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Fislik:
    build:
      targets:
        Fislik: all
        FislikTests: [test]
    test:
      targets:
        - FislikTests
